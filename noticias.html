<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periódico Digital Interactivo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg,#1a1a2e,#16213e);
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding: 20px;
  }
  .app-title {
    color:#fff;
    font-family: Arial, sans-serif;
    margin-bottom: 20px;
    text-align:center;
  }
  .app-title h1 { font-size:1.6rem; }
  .app-title p { font-size:.9rem; opacity:.7; }

  .book-container {
    perspective: 2500px;
    width: 90vw;
    max-width: 800px;
    height: 72vh;
    max-height: 580px;
    position: relative;
  }

  .book {
    width:100%;
    height:100%;
    position:relative;
    transform-style: preserve-3d;
  }

  .page {
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    background:#fdfbf5;
    border-radius: 4px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    transform-origin: left center;
    transform-style: preserve-3d;
    cursor: grab;
    backface-visibility: hidden;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .page:active { cursor: grabbing; }

  .page-front, .page-back {
    position:absolute;
    top:0;left:0;width:100%;height:100%;
    backface-visibility:hidden;
    padding: 28px 32px;
    overflow-y:auto;
    background:#fdfbf5;
  }
  .page-back { transform: rotateY(180deg); }

  .page-header {
    border-bottom: 3px double #c8102e;
    padding-bottom: 10px;
    margin-bottom: 15px;
    flex-shrink:0;
  }
  .masthead {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.8rem;
    font-weight:900;
    color:#1a1a1a;
    letter-spacing: 1px;
    text-align:center;
  }
  .page-sub {
    display:flex;
    justify-content:space-between;
    font-size:.7rem;
    color:#666;
    margin-top:6px;
    text-transform:uppercase;
    letter-spacing:.5px;
  }

  .category-tag {
    display:inline-block;
    font-size:.65rem;
    font-family: Arial, sans-serif;
    padding:3px 10px;
    border-radius:10px;
    margin-bottom:8px;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:#fff;
  }
  .cat-noticia { background:#2d8659; }
  .cat-video { background:#c8102e; }
  .cat-galeria { background:#7c4dff; }

  .headline {
    font-family: 'Playfair Display', Georgia, serif;
    font-size:1.3rem;
    line-height:1.25;
    margin-bottom:10px;
    color:#111;
  }
  .article-img {
    width:100%;
    height:130px;
    object-fit:cover;
    border-radius:4px;
    margin-bottom:10px;
    filter: sepia(8%);
  }
  .article-text {
    font-size:.83rem;
    line-height:1.6;
    color:#333;
  }
  .byline {
    font-size:.7rem;
    color:#888;
    font-style:italic;
    margin-bottom:10px;
  }
  .drop-cap::first-letter {
    font-family:'Playfair Display', Georgia, serif;
    font-size:2.6rem;
    font-weight:900;
    float:left;
    line-height:0.8;
    margin-right:6px;
    margin-top:4px;
    color:#c8102e;
  }
  .read-more-link {
    display:inline-block;
    margin-top:10px;
    font-size:.78rem;
    color:#c8102e;
    text-decoration:none;
    font-weight:bold;
    font-family:Arial, sans-serif;
  }

  /* Video embebido dentro de la hoja */
  .video-wrap {
    position:relative;
    width:100%;
    padding-bottom:56%;
    height:0;
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,0.25);
    margin-bottom:12px;
    background:#000;
  }
  .video-wrap iframe {
    position:absolute;
    top:0;left:0;width:100%;height:100%;
    border:none;
  }

  /* Galería dentro de la hoja */
  .gallery-grid {
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:8px;
    margin-top:8px;
  }
  .gallery-grid img {
    width:100%;
    height:90px;
    object-fit:cover;
    border-radius:4px;
    cursor:zoom-in;
    transition: transform .3s;
  }
  .gallery-grid img:hover { transform:scale(1.04); }
  .gallery-grid .full-span {
    grid-column: span 2;
    height:150px;
  }

  .page-num {
    position:absolute;
    bottom:10px;
    right:20px;
    font-size:.7rem;
    color:#999;
    font-family:Arial, sans-serif;
  }
  .page-num.left { right:auto; left:20px; }

  .book::after {
    content:'';
    position:absolute;
    top:0; left:50%;
    width:20px;
    height:100%;
    transform:translateX(-50%);
    background:linear-gradient(to right, rgba(0,0,0,0.15), transparent 40%, transparent 60%, rgba(0,0,0,0.15));
    pointer-events:none;
    z-index:5;
  }

  .controls {
    display:flex;
    gap:20px;
    margin-top:22px;
    align-items:center;
  }
  .nav-btn {
    width:50px;height:50px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.15);
    color:#fff;
    font-size:1.3rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all .3s;
    backdrop-filter: blur(10px);
  }
  .nav-btn:hover:not(:disabled) {
    background:rgba(255,255,255,0.3);
    transform:scale(1.1);
  }
  .nav-btn:disabled { opacity:.3; cursor:not-allowed; }
  .page-indicator {
    color:#fff;
    font-family:Arial, sans-serif;
    font-size:.9rem;
    opacity:.8;
    min-width:80px;
    text-align:center;
  }
  .hint {
    color:rgba(255,255,255,0.5);
    font-size:.75rem;
    margin-top:12px;
    font-family:Arial, sans-serif;
    text-align:center;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:.9} }

  /* Lightbox para fotos */
  .lightbox {
    position:fixed; inset:0;
    background:rgba(0,0,0,0.92);
    display:flex; align-items:center; justify-content:center;
    z-index:9999;
  }
  .lightbox img {
    max-width:90%; max-height:85%;
    border-radius:6px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  .lightbox-close {
    position:absolute; top:20px; right:30px;
    color:#fff; font-size:2.2rem; cursor:pointer;
    font-family:Arial, sans-serif;
  }

  @media (max-width:600px){
    .masthead{font-size:1.3rem}
    .headline{font-size:1.05rem}
    .book-container{height:78vh}
    .article-img{height:100px}
    .gallery-grid img{height:70px}
  }
</style>
</head>
<body>

<div class="app-title">
  <h1>📰 El Bárbula</h1>
  <p>Desliza las páginas · noticias, video y fotos</p>
</div>

<div class="book-container" id="bookContainer">
  <div class="book" id="book"></div>
</div>

<div class="controls">
  <button class="nav-btn" id="prevBtn">‹</button>
  <span class="page-indicator" id="pageIndicator">1 / 6</span>
  <button class="nav-btn" id="nextBtn">›</button>
</div>

<script>
// ======= CONTENIDO: mezcla de noticias, video y galería =======
// type: "noticia" | "video" | "galeria"
const contenido = [
  {
    type: "noticia",
    cat: "Institucional",
    title: "Inauguración del Nuevo Laboratorio de Ciencias",
    img: "https://images.unsplash.com/photo-1532094349884-543bc11b234d?w=600",
    author: "Redacción · 29 Sep 2025",
    text: "La Institución Educativa Atanasio Girardot inauguró un moderno laboratorio de ciencias equipado con tecnología de última generación para química, física y biología, fortaleciendo el aprendizaje práctico de los estudiantes.",
    url: "/noticias/2025/09/29/inauguracion-laboratorio/"
  },
  {
    type: "video",
    cat: "Multimedia",
    title: "Así vivimos la Feria de la Ciencia 2025",
    videoId: "dQw4w9WgXcQ",
    author: "Departamento Audiovisual · 15 Oct 2025",
    text: "Revive los mejores momentos de la Feria de la Ciencia, donde nuestros estudiantes presentaron proyectos de biología, química, física y tecnología ante toda la comunidad educativa."
  },
  {
    type: "noticia",
    cat: "Deportes",
    title: "Jornada Deportiva Intercolegial: Grandes Resultados",
    img: "https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=600",
    author: "Redacción · 2 Oct 2025",
    text: "Oro en fútbol sala, plata en voleibol y bronce en atletismo. Nuestros estudiantes demostraron compañerismo y juego limpio en cada competencia municipal.",
    url: "/noticias/2025/10/02/jornada-deportiva/"
  },
  {
    type: "galeria",
    cat: "Galería",
    title: "Festival Cultural Atanasiano en Imágenes",
    author: "Área de Artes · 5 Nov 2025",
    text: "Un recorrido visual por la danza, música y teatro que llenaron de color nuestro festival cultural anual.",
    fotos: [
      "https://images.unsplash.com/photo-1514306191717-452ec28c7814?w=400",
      "https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?w=400",
      "https://images.unsplash.com/photo-1524178232363-1fb2b075b655?w=400",
      "https://images.unsplash.com/photo-1526976668912-1a811878dd37?w=400",
      "https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?w=400"
    ]
  },
  {
    type: "noticia",
    cat: "Ambiental",
    title: "Campaña 'Atanasio Verde': Cuidemos Nuestro Planeta",
    img: "https://images.unsplash.com/photo-1532996122724-e3c354a0b15b?w=600",
    author: "Comité Ambiental · 3 Oct 2025",
    text: "Más de 100 kg de material reciclado y un jardín vertical construido por los propios estudiantes con materiales reutilizados.",
    url: "/noticias/2025/10/03/campana-ambiental/"
  },
  {
    type: "video",
    cat: "Multimedia",
    title: "Himno Institucional - Coro Atanasiano",
    videoId: "dQw4w9WgXcQ",
    author: "Coro Institucional · 2025",
    text: "Disfruta la interpretación de nuestro himno institucional a cargo del coro estudiantil, grabado en el auditorio principal."
  }
];

const book = document.getElementById('book');
const totalSheets = Math.ceil(contenido.length / 2);
let currentSheet = 0;
let isDragging = false;
let startX = 0;
let dragProgress = 0;
let activePage = null;

function catClass(type){
  if(type === 'video') return 'cat-video';
  if(type === 'galeria') return 'cat-galeria';
  return 'cat-noticia';
}

function buildCard(item, pageNum, side){
  if(!item){
    return `<div class="page-header"><div class="masthead">El Bárbula</div></div><div class="page-num ${side}">${pageNum}</div>`;
  }

  let media = '';
  if(item.type === 'noticia'){
    media = `<img class="article-img" src="${item.img}" alt="${item.title}">`;
  } else if(item.type === 'video'){
    media = `
      <div class="video-wrap">
        <iframe src="https://www.youtube.com/embed/${item.videoId}" allowfullscreen loading="lazy"></iframe>
      </div>`;
  } else if(item.type === 'galeria'){
    const imgs = item.fotos.map((f,i) => `<img src="${f}" class="${i===0?'full-span':''}" data-full="${f}">`).join('');
    media = `<div class="gallery-grid">${imgs}</div>`;
  }

  const link = item.url ? `<a class="read-more-link" href="${item.url}">Leer noticia completa →</a>` : '';

  return `
    <div class="page-header">
      <div class="masthead">Notiatanasiano</div>
      <div class="page-sub"><span>Edición Digital</span><span>${new Date().getFullYear()}</span></div>
    </div>
    <span class="category-tag ${catClass(item.type)}">${item.cat}</span>
    <h2 class="headline">${item.title}</h2>
    <div class="byline">${item.author}</div>
    ${media}
    <p class="article-text ${item.type==='noticia' ? 'drop-cap' : ''}">${item.text}</p>
    ${link}
    <div class="page-num ${side}">${pageNum}</div>
  `;
}

function createSheets(){
  book.innerHTML = '';
  for(let i=0;i<totalSheets;i++){
    const front = contenido[i*2];
    const back = contenido[i*2+1];
    const page = document.createElement('div');
    page.className = 'page';
    page.style.zIndex = totalSheets - i;
    page.dataset.index = i;
    page.innerHTML = `
      <div class="page-front">${buildCard(front, i*2+1, 'right')}</div>
      <div class="page-back">${buildCard(back, i*2+2, 'left')}</div>
    `;
    book.appendChild(page);
  }
  attachGalleryEvents();
  updateBook(true);
}

function attachGalleryEvents(){
  document.querySelectorAll('.gallery-grid img').forEach(img=>{
    img.addEventListener('click', e=>{
      e.stopPropagation();
      openLightbox(img.dataset.full);
    });
  });
}

function openLightbox(src){
  const box = document.createElement('div');
  box.className = 'lightbox';
  box.innerHTML = `<span class="lightbox-close">&times;</span><img src="${src}">`;
  box.addEventListener('click', ()=> box.remove());
  document.body.appendChild(box);
}

function updateBook(instant){
  const pages = document.querySelectorAll('.page');
  pages.forEach((page, i) => {
    page.style.transition = instant ? 'none' : 'transform 0.6s cubic-bezier(.4,0,.2,1)';
    if(i < currentSheet){
      page.style.transform = 'rotateY(-180deg)';
      page.style.zIndex = i;
    } else if(i === currentSheet && dragProgress !== 0){
      page.style.transform = `rotateY(${dragProgress}deg)`;
      page.style.zIndex = totalSheets + 1;
    } else {
      page.style.transform = 'rotateY(0deg)';
      page.style.zIndex = totalSheets - i;
    }
  });
  document.getElementById('pageIndicator').textContent = `${currentSheet+1} / ${totalSheets}`;
  document.getElementById('prevBtn').disabled = currentSheet === 0;
  document.getElementById('nextBtn').disabled = currentSheet === totalSheets - 1;
}

function nextPage(){
  if(currentSheet < totalSheets - 1){
    currentSheet++;
    dragProgress = 0;
    updateBook(false);
  }
}
function prevPage(){
  if(currentSheet > 0){
    currentSheet--;
    dragProgress = 0;
    updateBook(false);
  }
}

document.getElementById('nextBtn').addEventListener('click', nextPage);
document.getElementById('prevBtn').addEventListener('click', prevPage);

function getX(e){ return e.touches ? e.touches[0].clientX : e.clientX; }

book.addEventListener('mousedown', startDrag);
book.addEventListener('touchstart', startDrag, {passive:true});

function startDrag(e){
  if(e.target.closest('.gallery-grid') || e.target.closest('.video-wrap') || e.target.closest('.read-more-link')) return;
  const pages = document.querySelectorAll('.page');
  if(currentSheet >= totalSheets) return;
  activePage = pages[currentSheet];
  if(!activePage) return;
  isDragging = true;
  startX = getX(e);
  activePage.style.transition = 'none';
}

window.addEventListener('mousemove', onDrag);
window.addEventListener('touchmove', onDrag, {passive:true});

function onDrag(e){
  if(!isDragging || !activePage) return;
  const x = getX(e);
  const delta = x - startX;
  const containerWidth = document.getElementById('bookContainer').offsetWidth;
  let deg = (delta / containerWidth) * 180;
  deg = Math.max(-180, Math.min(0, deg));
  dragProgress = deg;
  activePage.style.transform = `rotateY(${deg}deg)`;
}

window.addEventListener('mouseup', endDrag);
window.addEventListener('touchend', endDrag);

function endDrag(){
  if(!isDragging) return;
  isDragging = false;
  if(dragProgress < -90){
    nextPage();
  } else {
    dragProgress = 0;
    updateBook(false);
  }
  activePage = null;
}

createSheets();

document.addEventListener('keydown', e=>{
  if(e.key === 'ArrowRight') nextPage();
  if(e.key === 'ArrowLeft') prevPage();
});
</script>
</body>
</html>
